# 真实实验环境：τ³-bench 航空域 + DeepSeek 真实大模型（温度 0）
# 被测智能体：τ³-bench LLMAgent（deepseek-v4-flash，LiteLLM 驱动）
# 框架模块 LLM：deepseek-chat（OpenAI 兼容接口，温度 0）
# taxonomy_file 留空：真实环境由 LLM 自由抽象（模拟环境 taxonomy 不适用）
env_name: exp_tau_retail
exp_mode: full_method

agent:
  type: t3bench                # 真实 τ³-bench
  domain: retail
  model: deepseek/deepseek-v4-flash
  temperature: 0.0

llm:
  provider: openai_compat
  model: deepseek-chat
  base_url: https://api.deepseek.com
  api_key: env:DEEPSEEK_API_KEY
  temperature: 0.0
  timeout_sec: 180
  max_retries: 3
  retry_backoff: [2, 5, 10]
  circuit_fail_threshold: 5
  circuit_cooldown_sec: 60
  json_fix_retries: 2

session:
  total_rounds: 12
  max_turns: 8
  concurrency: 2
  reset_on_error: true
  explorer: llm
  objectives:
    - 我是 noah_brown_6181，想退掉刚买的商品
    - 帮我查一下我的订单，user_id 是 noah_brown_6181
    - 收到的商品有质量问题，要退货，我是 noah_brown_6181
    - 订单 #W2611340 能退吗？我是 noah_brown_6181
    - 我要开发票，user_id noah_brown_6181
    - 物流一直没更新，帮我查查，订单 #W2611340
    - 我要换货，订单 #W2611340，noah_brown_6181
    - 退货后钱多久到账？noah_brown_6181
    - 我的优惠券为什么用不了，user noah_brown_6181
    - 能帮我催一下快递吗？订单 #W2611340
    - 我要查积分和会员等级，noah_brown_6181
    - 商品尺码不合适，想换一件，user_id noah_brown_6181
cache:
  enabled: true
  dir: data/cache

storage:
  data_dir: data/tau_retail
  trace_dir: data/tau_retail/trace

dbscan:
  eps: 0.99
  min_samples: 1

test:
  boundary_limit: 90

trace:
  level: INFO
  save_input_output: true

auditor_llm:
  provider: openai_compat
  model: glm-5.2
  base_url: https://open.bigmodel.cn/api/paas/v4
  api_key: env:GLM_API_KEY
  temperature: 0.0
  timeout_sec: 180
  max_retries: 3
  retry_backoff: [2, 5, 10]
  circuit_fail_threshold: 5
  circuit_cooldown_sec: 60
  json_fix_retries: 2
